readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.5.0",
    "torch>=1.7.0",
    "torchvision>=0.8.0",
    "numpy>=1.21.0",
    "Pillow>=8.0.0",
    "PyYAML>=5.4.0",
    "requests>=2.25.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "pandas>=1.3.0",
    "tqdm>=4.64.0",
    "scipy>=1.7.0",
    "thop>=0.1.1",
]
